function choices(correct,others){let opts=shuffle([...new Set(others.filter(x=>x&&x!==correct))]).slice(0,3);return shuffle([correct,...opts])}
function createQuestions(m){let p=pool(), all=LESSONS.flatMap(l=>l.items);let out=[];
if(m==='meaning')out=p.map(x=>({q:`「${x.d}」這個解釋指的是哪個成語？`,ans:x.w,opts:choices(x.w,all.map(z=>z.w)),why:`${x.w}：${x.d}`,lesson:x.lesson}));
if(m==='sentence')out=p.flatMap(x=>x.s.map(s=>{let q=s.includes('＿＿＿＿')?s:s.replace(x.w,'＿＿＿＿');return q.includes('＿＿＿＿')?{q:`請選出適合填入空格的成語：\n${q}`,ans:x.w,opts:choices(x.w,all.map(z=>z.w)),why:`${x.w}：${x.d}`,lesson:x.lesson}:null}).filter(Boolean));
if(m==='character')out=p.map(x=>{let letters=[...x.w],positions=letters.map((c,i)=>/^[\u3400-\u9fff]$/.test(c)?i:-1).filter(i=>i>=0);let pos=positions[Math.floor(Math.random()*positions.length)];if(pos===undefined)return null;let ans=letters[pos];let distractors=all.flatMap(z=>[...z.w]).filter(c=>/^[\u3400-\u9fff]$/.test(c)&&c!==ans);return {q:`成語填字：${letters.map((c,i)=>i===pos?'□':c).join('')}\n缺少的是哪個字？`,ans,opts:choices(ans,distractors),why:`完整成語：${x.w}。${x.d}`,lesson:x.lesson}}).filter(Boolean);
if(m==='relation')out=p.flatMap(x=>['n','a'].filter(k=>x[k]).map(k=>{let ans=x[k],relation=k==='n'?'近義詞':'反義詞',alternatives=all.flatMap(z=>[z.n,z.a,z.w]).filter(z=>z&&z!==ans);return {q:`「${x.w}」的${relation}是哪一個？`,ans,opts:choices(ans,alternatives),why:`${x.w}：${x.d}\n${relation}：${ans}`,lesson:x.lesson}}));return shuffle(out)}
function start(m){if(!selected.size){alert('請先選擇至少一課！');return}mode=m;questions=createQuestions(m);if(!questions.length){alert('所選課次沒有這個遊戲可用的題目，請換一課試試。');return}index=0;score=0;wrong=[];$('home').classList.add('hidden');$('finish').classList.add('hidden');$('play').classList.remove('hidden');$('modeTitle').textContent=({meaning:'📖 看解釋 選成語',sentence:'✏️ 造句填空',character:'🧩 生字填填看',relation:'🔄 近義反義'})[mode];renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}
function renderQuestion(){answered=false;let x=questions[index];$('bar').style.width=`${100*index/questions.length}%`;$('counter').textContent=`第 ${index+1} / ${questions.length} 題 · 第 ${x.lesson} 課`;$('points').textContent=`⭐ ${score} 分`;$('question').textContent=x.q;$('question').style.whiteSpace='pre-line';$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('options').innerHTML=x.opts.map((s,i)=>`<button class="opt" data-v="${esc(s)}"><span style="opacity:.6;margin-right:8px">${'ABCD'[i]}.</span>${esc(s)}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.v))}
function choose(v){if(answered)return;answered=true;let x=questions[index],ok=v===x.ans;if(ok)score++;else wrong.push({...x,chosen:v});document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===x.ans)b.classList.add('correct');else if(b.dataset.v===v)b.classList.add('wrong')});$('points').textContent=`⭐ ${score} 分`;$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'🎉 答對了，太厲害！':'💡 再記住這個成語！'}</strong><p>正確答案：<b>${esc(x.ans)}</b><br>${esc(x.why).replace(/\n/g,'<br>')}</p>`;$('next').classList.remove('hidden');$('next').textContent=index===questions.length-1?'查看闖關成績 🏆':'下一題 →';$('bar').style.width=`${100*(index+1)/questions.length}%`}
function finish(){ $('play').classList.add('hidden');$('finish').classList.remove('hidden');$('finalScore').textContent=`${score} / ${questions.length}`;let pct=Math.round(score/questions.length*100);$('finalMsg').textContent=`答對率 ${pct}% · ${pct===100?'全部答對！你是成語冒險王！':pct>=80?'表現很棒！再挑戰一次就更熟練了！':'繼續練習，每次都會更進步！'}`;$('review').innerHTML=wrong.length?`<h3>📒 錯題複習（${wrong.length} 題）</h3>`+wrong.map(x=>`<article><small>第 ${x.lesson} 課</small><div>${esc(x.q).replace(/\n/g,'<br>')}</div><div>你的答案：${esc(x.chosen)}　｜　<strong>正確答案：${esc(x.ans)}</strong></div><small>${esc(x.why)}</small></article>`).join(''):'<p style="text-align:center">✨ 全部答對，恭喜過關！</p>';window.scrollTo({top:0,behavior:'smooth'})}

$('next').onclick=()=>{index++;index<questions.length?renderQuestion():finish()};
$('back').onclick=$('goHome').onclick=()=>{$('play').classList.add('hidden');$('finish').classList.add('hidden');$('home').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
$('again').onclick=()=>start(mode);
let pickedMode='meaning';
function refreshPoster(){document.querySelectorAll('.lesson-hit').forEach(b=>{const on=selected.has(Number(b.dataset.i));b.classList.toggle('chosen',on);b.setAttribute('aria-pressed',String(on))});$('status').textContent=selected.size?`已選 ${selected.size} 課`:'尚未選課';}
document.querySelectorAll('.lesson-hit').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);selected.has(i)?selected.delete(i):selected.add(i);refreshPoster()});
$('all').onclick=()=>{selected.clear();LESSONS.forEach((_,i)=>selected.add(i));refreshPoster()};
$('none').onclick=()=>{selected.clear();refreshPoster()};
$('details').onclick=()=>{alert(LESSONS.map((l,i)=>`第 ${i+1} 課｜${l.name}（${l.items.length} 個成語）`).join('\n'))};
function chooseMode(m){pickedMode=m;document.querySelectorAll('.game-hit').forEach(b=>{const on=b.dataset.mode===m;b.classList.toggle('chosen',on);b.setAttribute('aria-pressed',String(on))})}
document.querySelectorAll('.game-hit').forEach(b=>b.onclick=()=>chooseMode(b.dataset.mode));
$('launch').onclick=()=>start(pickedMode);chooseMode('meaning');refreshPoster();
</script></body></html>
