const $=id=>document.getElementById(id);let selected=new Set([1]),questions=[],at=0,points=0,locked=false,mode='meaning';
const modes={meaning:'看解釋 選成語',sentence:'造句填空',character:'生字填填看',relation:'近義反義'};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function drawLessons(){$('lessons').innerHTML='';DATA.lessons.forEach((name,i)=>{let n=i+1,l=document.createElement('label');l.className='lesson';let input=document.createElement('input');input.type='checkbox';input.checked=selected.has(n);input.onchange=()=>{input.checked?selected.add(n):selected.delete(n);update()};let text=document.createElement('div');text.textContent=`第${n}課`;let sm=document.createElement('small');sm.textContent=name;text.append(sm);l.append(input,text);$('lessons').append(l)});update()}
function update(){$('count').textContent=`已選 ${selected.size} 課，共 ${DATA.items.filter(x=>selected.has(x.lesson)).length} 個成語`;document.querySelectorAll('.game').forEach(b=>b.disabled=!selected.size)}
$('all').onclick=()=>{selected=new Set(DATA.lessons.map((_,i)=>i+1));drawLessons()};$('clear').onclick=()=>{selected.clear();drawLessons()};
function choices(correct,pool){let arr=shuffle([...new Set(pool.filter(x=>x!==correct))]).slice(0,3);return shuffle([correct,...arr])}
function makeQuestions(m){let pool=DATA.items.filter(x=>selected.has(x.lesson));let result=[];for(let x of pool){if(m==='relation'){for(let [kind,value] of [['近義詞',x.syn],['反義詞',x.ant]]){if(!value)continue;let other=DATA.items.flatMap(z=>[z.syn,z.ant,z.word]).filter(Boolean);result.push({prompt:`「${x.word}」的${kind}是哪一個？`,correct:value,choices:choices(value,other),explain:`${x.word}：${x.meaning}。教材所列${kind}：${value}`})}continue}
if(m==='character'){let chars=[...x.word].filter(c=>/^[\u3400-\u9fff]$/.test(c));let target=chars[Math.floor(Math.random()*chars.length)];let pos=x.word.indexOf(target);let blank=x.word.slice(0,pos)+'□'+x.word.slice(pos+target.length);let other=DATA.items.flatMap(z=>[...z.word]).filter(c=>/^[\u3400-\u9fff]$/.test(c));result.push({prompt:`「${blank}」缺少哪一個字？`,correct:target,choices:choices(target,other),explain:`完整成語：${x.word}。${x.meaning}`});continue}
if(m==='sentence'){let samples=[...(x.example?[x.example]:[]),...(x.extraExamples||[])].filter(s=>s.includes(x.word));if(!samples.length)samples=[`請選出最符合這個情境的成語：＿＿＿＿（提示：${x.meaning}）`];for(let s of samples){let sentence=s.replace(x.word,'＿＿＿＿');result.push({prompt:sentence,correct:x.word,choices:choices(x.word,pool.map(z=>z.word)),explain:`${x.word}：${x.meaning}\n完整句子：${s}`})}continue}
result.push({prompt:x.meaning,correct:x.word,choices:choices(x.word,pool.map(z=>z.word)),explain:`${x.word}：${x.meaning}`})}return shuffle(result)}
function start(m){mode=m;questions=makeQuestions(m);if(!questions.length){alert('選擇的課次沒有此類題目，請選其他課次。');return}at=0;points=0;$('home').style.display='none';$('result').style.display='none';$('quiz').style.display='block';$('modeLabel').textContent=modes[m];show();window.scrollTo(0,0)}
function show(){locked=false;let q=questions[at];$('progressText').textContent=`第 ${at+1} / ${questions.length} 題`;$('score').textContent=`目前答對 ${points} 題`;$('bar').style.width=`${100*at/questions.length}%`;$('prompt').textContent=q.prompt;$('options').innerHTML='';$('feedback').hidden=true;$('next').hidden=true;q.choices.forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.textContent=`${'ABCD'[i]}. ${v}`;b.onclick=()=>answer(v);$('options').append(b)})}
function answer(v){if(locked)return;locked=true;let q=questions[at],good=v===q.correct;if(good)points++;document.querySelectorAll('.option').forEach(b=>{let value=b.textContent.slice(3);b.disabled=true;if(value===q.correct)b.classList.add('correct');else if(value===v)b.classList.add('wrong')});$('feedback').hidden=false;$('feedback').textContent=(good?'🎉 答對了！':'💡 答錯了，正確答案：'+q.correct)+'\n'+q.explain;$('feedback').style.whiteSpace='pre-line';$('next').hidden=false;$('next').textContent=at===questions.length-1?'查看成績 →':'下一題 →';$('bar').style.width=`${100*(at+1)/questions.length}%`}
$('next').onclick=()=>{at++;if(at<questions.length){show();return}$('quiz').style.display='none';$('result').style.display='block';$('summary').textContent=`答對 ${points} / ${questions.length} 題`;$('detail').textContent=`正確率 ${Math.round(points/questions.length*100)}%｜${modes[mode]}`;window.scrollTo(0,0)};
function home(){$('quiz').style.display='none';$('result').style.display='none';$('home').style.display='block';window.scrollTo(0,0)}
